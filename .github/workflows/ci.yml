# ci.yml — every PR. Red = no merge.
#
# Scope during stealth: product correctness and architectural invariants only.
# Publication-gate scripts (release state, registry consistency, claims/wording,
# GitHub release metadata, frozen records) are parked behind `make release-gates`
# and run manually before a real publish. See docs/ci-scope.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the pinned toolchain from rust-toolchain.toml
      - run: cargo fmt --all --check

  clippy:
    # includes the disallowed network API lints from clippy.toml (invariant 5b)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  deny:
    # ADR-0004 license allowlist + network-crate bans + advisories (invariant 5a, 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  gates:
    # Publication-safety gates, on every PR instead of only inside `make release-gates`.
    # docs/ci-scope.md parked these because nothing was being published; the cost of parking
    # them is that they fail in a batch at release time and read as "the release is blocked
    # on twenty things". They are the same checks either way — this is only about when.
    #
    # fetch-depth: 0 is required: _lightcheck.base_ref() resolves origin/main and SystemExits
    # without it. On push to main the merge-base equals HEAD, so the diff-scoped members
    # (check_release_boundary_paths, check_golden_change_rationale) pass vacuously there and
    # do their real work on pull_request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: claims, posture, ledger, boundary paths, golden rationale, validation records
        run: make light-check
      - name: registry surfaces and the npm package suite
        run: make registry-surface-check
      - name: gate unit tests
        # These three test the gate scripts themselves and were referenced by no workflow and
        # no Makefile target, so they had never run anywhere.
        run: |
          python3 .github/scripts/test_check_verify_dependency_boundary.py
          python3 .github/scripts/test_check_golden_change_rationale.py
          python3 .github/scripts/test_validation_record_integrity.py

  test:
    # unit + fixture tests, c14n idempotence property tests, contract vectors,
    # deterministic-profile pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - run: cargo test --locked --workspace --all-features
      - name: Grounding JSON validator resource ceiling
        # Both capability shapes, release profile. Without this the ceiling test is skipped
        # by its own env guard and a superlinear regression merges green.
        run: make validator-ceiling-check
      - name: fixture manifest validation
        run: python3 fixtures/validate_fixtures.py
      - name: published Action contract
        # Reachable from nothing before this. While it was unreachable the Action stayed
        # pinned to v0.4.0 with v0.4.0 checksums, two releases behind, and the contract test
        # that would have said so was never executed.
        run: make ethos-verify-action-contract
      - name: layout evaluator alpha
        run: make layout-evaluator-alpha
      - name: citation emission v1 contract
        # Guards the documented pointer-first integration path and its runnable examples.
        run: make citation-emission-v1-contract
      - name: Python surface tests
        run: PYTHONPATH=python python3 -m unittest discover -s python/tests
      - name: npm package test dependencies
        run: npm ci --prefix packages/npm/ethos-pdf --ignore-scripts
      - name: npm package integrity tests
        run: npm test --prefix packages/npm/ethos-pdf

  dogfood:
    # The product claim, tested end to end from current source: a grounded citation
    # set exits 0, a fabricated one exits 1. Deliberately built from this tree rather
    # than a checksum-pinned published CLI, so a format change fails here on purpose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --locked -p ethos-cli
      - name: grounded citations verify clean
        run: |
          ./target/debug/ethos verify schemas/examples/document.example.json \
            --citations examples/verify/native_grounded_citations.json \
            --fail-on-ungrounded
      - name: fabricated citations are caught
        run: |
          set +e
          ./target/debug/ethos verify schemas/examples/document.example.json \
            --citations examples/verify/native_ungrounded_citations.json \
            --fail-on-ungrounded
          code=$?
          set -e
          test "$code" = "1"

  released-cli-action-dogfood:
    # This validates the current Action wrapper against its checksum-pinned public
    # CLI. Current-source verifier behavior is covered by the test and determinism jobs.
    # Deleted in c7d893d during the v0.6.0 work, which left the published Action with no
    # coverage at all; the test that asserts this job exists was itself unreachable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Accept the grounded README fixture
        id: grounded
        uses: ./actions/verify
        with:
          source: schemas/examples/document.example.json
          citations: examples/verify/native_grounded_citations.json
          report: target/action-dogfood/grounded.json
      - name: Reject the fabricated README fixture
        id: fabricated
        continue-on-error: true
        uses: ./actions/verify
        with:
          source: schemas/examples/document.example.json
          citations: examples/verify/native_ungrounded_citations.json
          report: target/action-dogfood/fabricated.json
      - name: Assert the expected verification outcomes
        if: always()
        shell: bash
        env:
          GROUNDED_OUTCOME: ${{ steps.grounded.outcome }}
          FABRICATED_OUTCOME: ${{ steps.fabricated.outcome }}
        run: |
          test "$GROUNDED_OUTCOME" = "success"
          test "$FABRICATED_OUTCOME" = "failure"

  verify-portability:
    # Invariant 4: ethos-verify compiles against the grounding trait module alone and
    # its dependency tree never contains parser internals.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo check --locked -p ethos-verify
      - run: cargo check --locked -p ethos-grounding-opendataloader-json
      - name: no parser internals in the verify tree
        run: python3 .github/scripts/check_verify_dependency_boundary.py
      - name: grounding feature really is minimal
        run: |
          # the trait module must build without serde_json/sha2/thiserror
          cargo check --locked -p ethos-doc-core --no-default-features --features grounding
          cargo check --locked -p ethos-doc-core --no-default-features --features verify-types

  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18"
      - run: python3 schemas/validate_examples.py
      - run: python3 schemas/test_security_report_validation.py
      - run: python3 schemas/test_table_model_validation.py
      - run: python3 schemas/test_proof_statement_validation.py
      - run: python3 fixtures/validate_fixtures.py

  no-network-runtime:
    # Invariant 5c: the base CLI functions with zero network egress. Runs the CLI inside
    # a no-net namespace; any egress attempt fails hard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --locked -p ethos-cli
      - name: run CLI under network-denied namespace
        run: |
          sudo unshare -n -- ./target/debug/ethos fingerprint schemas/examples/document.example.json
          sudo unshare -n -- ./target/debug/ethos rag chunk schemas/examples/document.example.json > /tmp/chunks.jsonl
          test -s /tmp/chunks.jsonl

  rag-framework-examples:
    # The adoption path: LangChain/LlamaIndex examples must run twice byte-identically
    # with no API keys. Broken examples fail for strangers evaluating Ethos, not for us.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      - run: pip install -r examples/citation-emission/requirements-frameworks.txt
      - run: make rag-framework-examples

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check DCO sign-offs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .github/scripts/check_dco.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            python3 .github/scripts/check_dco.py "${{ github.event.before }}" "${{ github.sha }}"
          fi
