name: v0.5 release candidate

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: release candidate contract tests
        run: |
          python3 .github/scripts/test_ethos_full_candidate.py
          python3 .github/scripts/test_smoke_ethos_full_candidate.py
          python3 .github/scripts/test_release_artifact_workflow_prep.py
          python3 .github/scripts/test_v0_5_0_version_activation.py

  cli-draft:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_target: macos-arm64
            os: macos-14
          - artifact_target: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build CLI
        run: cargo build --locked --release -p ethos-cli
      - name: assemble and smoke base CLI archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          out="target/release-artifacts/ethos-${{ matrix.artifact_target }}"
          mkdir -p "$out"
          cp target/release/ethos "$out/ethos"
          cp LICENSE NOTICE docs/pdfium-manual-setup.md "$out/"
          python3 .github/scripts/build_release_cli_archive.py --artifact-dir "$out" --out "$out.tar.gz"
          shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"
          python3 .github/scripts/write_release_artifact_inventory.py --artifact "$out.tar.gz" --checksum "$out.tar.gz.sha256" --target "${{ matrix.artifact_target }}" --out "$out.inventory.json"
          python3 .github/scripts/smoke_release_cli_artifact.py --artifact-dir "$out" --expected-version "ethos $version" --target "${{ matrix.artifact_target }}" --out "$out.smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v0.5-cli-draft-${{ matrix.artifact_target }}
          path: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.sha256
            target/release-artifacts/*.inventory.json
            target/release-artifacts/*.smoke.json

  ethos-full:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_target: macos-arm64
            os: macos-14
          - artifact_target: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build CLI
        run: cargo build --locked --release -p ethos-cli
      - name: build and smoke candidate twice
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          pdfium_archive="target/release-artifacts/pdfium-${{ matrix.artifact_target }}.tgz"
          url=$(python3 -c "import json, urllib.parse; p=json.load(open('profiles/ethos-deterministic-v1.json')); b=p['backend']; base,tag=b['distribution']['release_url'].rsplit('/tag/',1); print(f\"{base}/download/{urllib.parse.quote(tag, safe='')}/{b['platform_artifacts']['${{ matrix.artifact_target }}']['name']}\")")
          mkdir -p target/release-artifacts/run1 target/release-artifacts/run2
          curl -fL --retry 3 --output "$pdfium_archive" "$url"
          for run in run1 run2; do
            python3 scripts/build-ethos-full-candidate.py --target "${{ matrix.artifact_target }}" --version "$version" --ethos-binary target/release/ethos --pdfium-archive "$pdfium_archive" --out-dir "target/release-artifacts/$run"
          done
          artifact="ethos-full-$version-${{ matrix.artifact_target }}"
          cmp "target/release-artifacts/run1/$artifact.tar.gz" "target/release-artifacts/run2/$artifact.tar.gz"
          cmp "target/release-artifacts/run1/$artifact.tar.gz.sha256" "target/release-artifacts/run2/$artifact.tar.gz.sha256"
          cmp "target/release-artifacts/run1/$artifact.inventory.json" "target/release-artifacts/run2/$artifact.inventory.json"
          python3 .github/scripts/smoke_ethos_full_candidate.py --archive "target/release-artifacts/run1/$artifact.tar.gz" --checksum "target/release-artifacts/run1/$artifact.tar.gz.sha256" --inventory "target/release-artifacts/run1/$artifact.inventory.json" --extract-dir target/release-artifacts/extracted --expected-version "ethos $version" --fixture fixtures/synthetic/simple-text/document.pdf --out "target/release-artifacts/run1/$artifact.smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v0.5-ethos-full-candidate-${{ matrix.artifact_target }}
          path: |
            target/release-artifacts/run1/*.tar.gz
            target/release-artifacts/run1/*.sha256
            target/release-artifacts/run1/*.inventory.json
            target/release-artifacts/run1/*.smoke.json
