# determinism.yml — nightly + contract-change PRs (plan §9).
# Gate Zero platforms first (macOS arm64 + Linux x64); Windows x64 runs a Milestone B
# preflight lane. Unresolved Windows divergence blocks or re-scopes Public Beta.
# Determinism failures are NEVER retried into green — a flaky fingerprint IS the bug.
name: determinism

on:
  schedule:
    - cron: "17 3 * * *" # nightly
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:

jobs:
  cross-platform:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'contract-change')
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 + Linux x64 are the Gate Zero platforms. Windows x64 is a
        # Milestone B preflight lane and only runs PDFium-backed corpus work when
        # the pinned runtime is explicitly configured on that runner.
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema>=4.18"
      # The contract vectors pin exact c14n bytes + sha256 per platform. The verifier
      # suite and verify-alpha runner add cross-platform execution of the parser-neutral
      # verifier, repeated report byte equality, and comparison to tracked goldens.
      - run: cargo test --locked -p ethos-doc-core --all-features
      - run: cargo test --locked -p ethos-verify
      - name: verification report repeated-byte and golden equality
        shell: bash
        run: |
          cargo build --locked -p ethos-cli
          ethos_bin="${GITHUB_WORKSPACE}/target/debug/ethos"
          if [ "${RUNNER_OS}" = "Windows" ]; then ethos_bin="${ethos_bin}.exe"; fi
          python examples/verify/check_verify_alpha.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --ethos-bin "${ethos_bin}" \
            --out-dir "${RUNNER_TEMP}/verify-alpha"
      # Without this the step below always took its else branch: nothing in this repository
      # set ETHOS_PDFIUM_LIBRARY_PATH, so the PDF corpus and the double-parse equality test
      # printed "deferred" and the job reported green. The riskiest path in the product was
      # first exercised at tag time. scripts/fetch-pdfium.sh verifies the pinned archive hash
      # before extraction and the runtime library hash after it, and supports exactly the two
      # Gate Zero platforms; Windows keeps deferring, as the matrix comment says it should.
      - name: configure the profile-pinned PDFium runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          scripts/fetch-pdfium.sh "${RUNNER_TEMP}/pdfium"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            lib="${RUNNER_TEMP}/pdfium/lib/libpdfium.dylib"
          else
            lib="${RUNNER_TEMP}/pdfium/lib/libpdfium.so"
          fi
          echo "ETHOS_PDFIUM_LIBRARY_PATH=${lib}" >> "$GITHUB_ENV"
      - name: configured PDFium fixture corpus and double-parse equality
        shell: bash
        run: |
          if [ -n "${ETHOS_PDFIUM_LIBRARY_PATH:-}" ] && [ -f "${ETHOS_PDFIUM_LIBRARY_PATH:-}" ]; then
            ethos_bin="${GITHUB_WORKSPACE}/target/debug/ethos"
            if [ "${RUNNER_OS}" = "Windows" ]; then ethos_bin="${ethos_bin}.exe"; fi
            # run_fixtures.py records failures in its JSON and prints nothing, so a red
            # step gave no clue which fixture broke. Report them before exiting.
            # The checked-in goldens were generated on macOS arm64 and carry bbox values.
            # docs/determinism-contract.md computes the stable payload projection "after
            # recursively excluding object keys named bbox and bboxes", because PDFium reports
            # platform-sensitive rectangle dimensions for otherwise identical text. Comparing
            # bbox off the golden platform therefore asserts more than the contract guarantees.
            # macOS compares everything; the other platforms compare what is actually promised.
            compare_scope=""
            if [ "${RUNNER_OS}" != "macOS" ]; then
              compare_scope="--stable-only"
            fi
            set +e
            python benchmarks/harness/run_fixtures.py \
              --repo-root "${GITHUB_WORKSPACE}" \
              --ethos-bin "${ethos_bin}" \
              --out "${RUNNER_TEMP}/fixture-baseline.json" \
              --emit-projections "${RUNNER_TEMP}/projections" \
              ${compare_scope}
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              python - "${RUNNER_TEMP}/fixture-baseline.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("status:", d.get("status"))
          for f in d.get("fixtures", []):
              if f.get("status") == "fail":
                  print(f"FAIL {f.get('id')}")
                  for reason in f.get("failures", []):
                      print(f"     {reason}")
          PY
              exit "$rc"
            fi
            cargo test --locked -p ethos-cli --test pdf_parse \
              double_parse_is_byte_identical_when_pdfium_is_configured -- --exact --nocapture
          else
            echo "deferred: caller-provided PDFium runtime is not configured on this runner"
          fi
      - name: upload actual projections
        if: failure() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: projections-${{ matrix.os }}
          path: ${{ runner.temp }}/projections
